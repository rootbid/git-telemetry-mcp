[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-telemetry-mcp"
version = "0.1.2"
description = "MCP server exposing git reflog, working directory, and bash history as temporal context tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Git Telemetry MCP Contributors" }
]
keywords = ["mcp", "git", "telemetry", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jsonschema>=4.26.0",
    "starlette>=0.46",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
]

[project.scripts]
git-telemetry-mcp = "git_telemetry_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
